3. Headings

HTML provides six heading levels.

<h1>Main Heading</h1>
<h2>Heading 2</h2>
<h3>Heading 3</h3>
<h4>Heading 4</h4>
<h5>Heading 5</h5>
<h6>Heading 6</h6>


Important
<h1> is generally the most important heading.

<h6> is the least important heading.

    
Example:

<h1>HTML Course</h1>

<h2>Introduction</h2>

<h3>What is HTML?</h3>
Paragraph <p>

Used to create paragraphs.

<p>This is a paragraph.</p>

Example:

<p>
    HTML is used to create the structure of web pages.
</p>
Line Break <br>

Used to move text to the next line.

Hello<br>
World

Output:

Hello
World
Horizontal Rule <hr>

Creates a thematic break or horizontal line.

<hr>

Example:

<h1>About Me</h1>
<hr>
<p>I am a web developer.</p>
Comments in HTML

Comments are not displayed on the webpage.

Syntax:

< This is a comment -->
