<!DOCTYPE html>
3. Structure of an HTML Document

A basic HTML document looks like this:

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>

<body>

    <h1>Hello World</h1>
    <p>Welcome to my website.</p>

</body>

</html>
Explanation
<!DOCTYPE html>

Tells the browser that this document uses HTML5.

<html>

This is the root element of the HTML document.

<html lang="en">

lang="en" specifies that the page language is English.

<head>

Contains metadata and resources that are generally not directly displayed on the webpage.

Examples:

Title
Meta tags
CSS files
JavaScript files
<body>

Contains the visible content of the webpage.

For example:

<body>
    <h1>Hello</h1>
    <p>This content is visible.</p>
</body>
4. Role of HTML in Web Development

HTML is the foundation of web development.

Think of a website like a human body:

HTML → Skeleton/Structure
CSS → Appearance/Design
JavaScript → Behavior/Functionality
Example

HTML:

<button>Click Me</button>

CSS can style it:

button {
    padding: 10px;
}

JavaScript can make it interactive:

button.addEventListener("click", function () {
    alert("Button clicked!");
});

Therefore:

HTML creates the structure, CSS creates the design, and JavaScript adds functionality. -->
